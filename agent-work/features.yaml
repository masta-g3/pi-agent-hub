- epic: worktree-setup
  status: pending
  title: Repository-defined worktree setup hooks
  description: User can create Hub-owned worktree sessions that are provisioned by
    an opt-in, tracked .pi/worktree-setup executable before Hub registers or starts
    Pi, with visible failures and rollback-safe behavior across single- and multi-repo
    sessions.
  steps:
  - After git worktree creation, detect an executable .pi/worktree-setup independently
    in each created repository worktree.
  - Run each setup script synchronously from its worktree root before registry insertion,
    workspace materialization, or managed Pi startup.
  - Provide minimal PI_HUB_WORKTREE_PATH, PI_HUB_SOURCE_REPO, PI_HUB_WORKTREE_BRANCH,
    and PI_HUB_WORKTREE_ROLE environment variables.
  - For multi-repo sessions, run every repository setup script deterministically and
    fail the whole creation flow if any script fails.
  - Surface concise setup progress and captured failure output through the existing
    new-session action flow.
  - Reuse existing create-session rollback so failed setup does not leave a registered
    session or running tmux process and newly created worktrees are removed when rollback
    succeeds.
  - Do not infer package managers, share dependency directories, use session.prelude,
    or run setup again on session restart.
  - Require scripts to be tracked, executable, and documented as trusted repository
    code that should be idempotent.
  - Add tests for absent hooks, successful hooks, non-executable files, failures,
    environment/cwd, multi-repo ordering, rollback, and unchanged non-worktree session
    creation.
  priority: 2
  depends_on: []
  discovered_from: archive-ux-001
  plan_file: null
  references:
  - src/core/worktree.ts
  - src/app/session-commands.ts
  - src/core/config.ts
  - docs/CONFIG.md
  created_at: '2026-07-12'
